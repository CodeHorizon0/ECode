[package]
name = "ECode"
version = "0.3.2"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
vscode-theme-syntect = "0.1.1"
portable-pty = "0.9.0"
vt100 = "0.16.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
